<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Ad</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">Nova<span>Tech</span></div>
        <nav class="nav">
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">Buy</a>
        </nav>
      </header>

      <main class="main">
        <section class="hero">
          <div class="hero-text">
            <p class="tag">New</p>
            <h1>Fast <span>computer</span>.</h1>
            <p class="text">Easy to use. Great for school and work.</p>
            <div class="buttons">
              <a href="#" class="btn btn-blue">Buy</a>
              <a href="#" class="btn btn-light">More</a>
            </div>
          </div>

          <div class="computer-box">
            <div class="screen"></div>
            <div class="base"></div>
            <div class="stand"></div>
            <div class="price">$899</div>
          </div>
        </section>

        <section class="specs">
          <div class="spec">
            <h3>16GB</h3>
            <p>Big memory</p>
          </div>
          <div class="spec">
            <h3>1TB</h3>
            <p>Lots of space</p>
          </div>
          <div class="spec">
            <h3>Fast</h3>
            <p>Quick and smooth</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
